/*
 * Build this extension against the installed Ghidra distribution.
 *
 * Set GHIDRA_INSTALL_DIR or pass -PGHIDRA_INSTALL_DIR=/path/to/ghidra.
 */
def ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
if (!ghidraInstallDir && project.hasProperty("GHIDRA_INSTALL_DIR")) {
	ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}
if (!ghidraInstallDir) {
	throw new GradleException("GHIDRA_INSTALL_DIR must point to the Ghidra installation")
}

apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"

version = "0.1.0"
group = "aether"

// The Java plugin launches this bundled runtime. Keep tests and generated bytecode out of the ZIP.
buildExtension.exclude 'agent/tests/**'
buildExtension.exclude 'agent/.venv/**'
buildExtension.exclude 'agent/**/__pycache__/**'
buildExtension.exclude 'agent/**/*.pyc'

dependencies {
	// The bridge uses the JDK HTTP server and has no third-party dependencies.
}
